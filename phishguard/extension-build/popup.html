<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhishGuard</title>
  <style>
    @font-face { font-family: 'Archivo'; font-weight: 400; src: url('archivo-400.woff2') format('woff2'); }
    @font-face { font-family: 'Archivo'; font-weight: 700; src: url('archivo-700.woff2') format('woff2'); }

    :root {
      --bg: #0c0d0e; --ink: #f4f4f5; --muted: #a1a1aa; --rule: #2a2c30; --hover: #1b1d21;
      --ok: #2dd4bf; --bad: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px; background: var(--bg); color: var(--ink);
      font: 14px/1.45 'Archivo', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 2px solid var(--ink); }
    .top img { width: 22px; height: 22px; }
    .top b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .top span { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    .status { padding: 14px; }
    .state { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; line-height: 1.2; }
    .state::before { content: ''; flex: none; width: 10px; height: 10px; background: var(--muted); }
    .state[data-ok="true"]::before { background: var(--ok); }
    .state[data-ok="false"]::before { background: var(--bad); }
    .what { margin-top: 6px; color: var(--muted); }

    .facts { border-top: 1px solid var(--rule); }
    .facts div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--rule); }
    .facts dt { color: var(--muted); }
    .facts dd { text-align: right; font-variant-numeric: tabular-nums; }
    .facts dd[data-ok="false"] { color: var(--bad); }

    .links { display: flex; flex-direction: column; margin-top: 10px; border-top: 2px solid var(--ink); }
    .links button {
      display: flex; justify-content: space-between; align-items: center; padding: 11px 14px;
      border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink);
      font: inherit; font-weight: 700; text-align: left; cursor: pointer;
    }
    .links button::after { content: '→'; font-weight: 400; color: var(--muted); }
    .links button:hover { background: var(--hover); }
    .links button:focus-visible { outline: 2px solid var(--ok); outline-offset: -2px; }
  </style>
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="">
    <b>PhishGuard</b>
    <span id="version"></span>
  </header>

  <section class="status">
    <p class="state" id="state">Checking…</p>
    <p class="what">Warns you about scam messages in Gmail, WhatsApp Web and LinkedIn, and checks links before they open.</p>
  </section>

  <dl class="facts">
    <div><dt>Scanner</dt><dd id="scanner">Checking…</dd></div>
    <div><dt>Blocklist</dt><dd id="blocklist">Checking…</dd></div>
  </dl>

  <nav class="links">
    <button type="button" data-path="/link">Check a link</button>
    <button type="button" data-path="/report">Report a scam</button>
    <button type="button" data-path="/dashboard">Community reports</button>
  </nav>

  <script src="popup.js"></script>
</body>
</html>
