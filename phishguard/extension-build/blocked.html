<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by PhishGuard</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <header class="bar">
      <img src="icon.png" alt="" />
      <span>PhishGuard blocked this page</span>
      <span class="score">Risk <strong id="riskScore">0</strong>/100 · <span id="riskLevel">HIGH</span></span>
    </header>

    <main class="wrap">
      <h1>This link looks like a scam</h1>
      <p class="summary" id="summaryText">It matches patterns seen on phishing and scam sites.</p>

      <p class="label">The link</p>
      <code id="blockedUrl" class="url">-</code>

      <p class="label">Why it was blocked</p>
      <ul id="reasonList" class="reasons"></ul>

      <div class="actions">
        <button type="button" id="goBackBtn" class="primary">Go back to safety</button>
        <button type="button" id="proceedBtn" class="danger">Open it anyway</button>
      </div>

      <p class="feedback">Is this a scam? <button type="button" id="reportBtn">Yes, keep blocking it</button></p>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>
