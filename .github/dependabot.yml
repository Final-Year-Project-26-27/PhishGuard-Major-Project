version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/phishguard"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/mlmodel"
    schedule:
      interval: "weekly"
    ignore:
      # .pkl models are pickled with 1.7.1; bump only together with a retrain
      - dependency-name: "scikit-learn"
